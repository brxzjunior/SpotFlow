services:
  postgres:
    image: postgres:16-alpine
    container_name: spotflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotflow
      POSTGRES_PASSWORD: spotflow_secret
      POSTGRES_DB: spotflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotflow -d spotflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: spotflow_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=spotflow
      - N8N_BASIC_AUTH_PASSWORD=spotflow_secret
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
